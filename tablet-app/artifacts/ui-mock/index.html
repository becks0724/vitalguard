<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VitAlGuard 현장 태블릿 — 서비스화면 시안</title>
<link rel="stylesheet" href="tokens.css">
<style>
/* ── 시안 뷰어 셸 (앱 화면이 아님 — 평가용 바깥 UI) ───────────── */
.shell { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }

.side {
  background: #1B1D21; color: #E7E9EC; padding: 20px 16px;
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.side h1 { font-size: 16px; margin: 0 0 4px; letter-spacing: -.01em; }
.side .sub { font-size: 12px; color: #9AA0A8; margin-bottom: 20px; line-height: 1.5; }
.side .grp { font-size: 11px; color: #7C838C; margin: 18px 0 6px; letter-spacing: .04em; }
.side button {
  display: block; width: 100%; text-align: left; background: transparent;
  border: 0; color: #C9CED5; padding: 9px 10px; border-radius: 8px;
  font-size: 13px; cursor: pointer; font-family: inherit; line-height: 1.4;
}
.side button:hover { background: #26292E; color: #fff; }
.side button[aria-current="true"] { background: var(--primary); color: #fff; font-weight: 700; }
.side .note { font-size: 11px; color: #7C838C; margin-top: 20px; line-height: 1.6; border-top: 1px solid #2C3036; padding-top: 14px; }

.stage { padding: 24px 28px 60px; overflow-x: auto; }
.stage-bar {
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  margin-bottom: 18px;
}
.seg { display: inline-flex; background: #DDE0E5; border-radius: var(--radius-pill); padding: 3px; }
.seg button {
  border: 0; background: transparent; padding: 7px 16px; border-radius: var(--radius-pill);
  font-size: 13px; font-weight: 700; color: #55595F; cursor: pointer; font-family: inherit;
}
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.14); }
.stage-meta { font-size: 12px; color: #6A6F76; }
.stage-meta code { background: #DDE0E5; padding: 2px 6px; border-radius: 4px; }

/* ── 기기 프레임 — 실제 dp 를 px 로 1:1 ──────────────────────── */
.device {
  background: #0F1114; border-radius: 28px; padding: 10px;
  box-shadow: 0 20px 50px rgba(0,0,0,.28);
  width: max-content;
}
.screen {
  position: relative; overflow: hidden; border-radius: 20px;
  background: var(--canvas);
  display: flex; flex-direction: column;
}
/* 세로 866×1385 / 가로 1385×866 (전체 화면 기준) */
.portrait  .screen { width: 866px;  height: 1385px; }
.landscape .screen { width: 1385px; height: 866px; }

/* 시스템 인셋 시각화 */
.inset-status, .inset-nav {
  position: absolute; left: 0; right: 0; z-index: 40;
  background: repeating-linear-gradient(45deg, rgba(0,0,0,.05) 0 6px, transparent 6px 12px);
  pointer-events: none; display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: #8A9099; letter-spacing: .04em;
}
.inset-status { top: 0; height: 39px; }
.inset-nav    { bottom: 0; height: 15px; }
.inset-edge {
  position: absolute; top: 0; bottom: 0; width: 30px; z-index: 40; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(239,68,68,.07) 0 6px, transparent 6px 12px);
}
.inset-edge.l { left: 0; } .inset-edge.r { right: 0; }
.screen[data-insets="off"] .inset-status,
.screen[data-insets="off"] .inset-nav,
.screen[data-insets="off"] .inset-edge { display: none; }

/* ── 앱 공통 크롬 ────────────────────────────────────────── */
.app { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.app-top {
  padding: 47px 30px 8px;            /* 상단 39dp 인셋 + 8 */
  border-bottom: 1px solid var(--hairline); background: var(--canvas);
}
.top-line1 { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.site-chip {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: var(--fs-title); font-weight: 800;
}
.site-chip .caret { font-size: 13px; color: var(--muted); }
.top-right { display: flex; align-items: center; gap: 10px; }

/* 비차단 경보 스트립 — 자동 모달 없음. 슬롯은 항상 예약(레이아웃 고정) */
.alert-strip {
  margin-top: 8px; min-height: 56px;
  display: flex; align-items: center; gap: 12px;
  padding: 8px 12px; border-radius: 12px;
  background: var(--danger-tint); border: 1px solid rgba(239,68,68,.35);
}
.alert-strip[data-empty="true"] { background: var(--surface-soft); border-color: var(--hairline); }
.alert-strip .grow { flex: 1; min-width: 0; }

.app-body { flex: 1; overflow: hidden; padding: 14px 30px; }
.app-body.scroll { overflow-y: auto; }

/* 하단 목적지 바 — 네비바 15dp 만큼 더 패딩 */
.app-tabs {
  display: flex; border-top: 1px solid var(--hairline); background: var(--canvas);
  padding-bottom: 15px;
}
.app-tabs button {
  flex: 1; min-height: var(--tap-primary); border: 0; background: transparent;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  font-family: inherit; font-size: var(--fs-caption); font-weight: 700; color: var(--body);
  cursor: pointer; position: relative;
}
.app-tabs button[aria-current="true"] { color: var(--primary); }
.app-tabs .ic { }
.tab-badge {
  position: absolute; top: 6px; left: 50%; margin-left: 8px;
  background: var(--danger); color: var(--ink);
  border: 1px solid rgba(0,0,0,.18);
  border-radius: var(--radius-pill); font-size: 11px; font-weight: 800;
  padding: 1px 6px;
}

/* ── 화면별 ─────────────────────────────────────────────── */
.sec-title { display: flex; align-items: baseline; justify-content: space-between; margin: 2px 0 10px; }

.signal-row { display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 12px 16px; border-bottom: 1px solid var(--hairline); cursor: pointer; }
.signal-row:last-child { border-bottom: 0; }
.signal-row .w-label { width: 92px; flex: none; font-weight: 700; font-size: var(--fs-body); }
.signal-row .w-text  { flex: 1; min-width: 0; font-size: var(--fs-label); color: var(--body);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.signal-row .w-time  { flex: none; font-size: var(--fs-caption); color: var(--body); }
.signal-row .w-go    { flex: none; color: var(--muted); }

.stale { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-caption); color: var(--body); }


.kpi { display: flex; gap: 10px; margin-bottom: 12px; }
.kpi .box { flex: 1; padding: 12px 14px; border-radius: 12px; background: var(--surface-soft); border: 1px solid var(--hairline); }
.kpi .box .k { font-size: var(--fs-caption); color: var(--body); }
.kpi .box .v { font-size: 22px; font-weight: 800; }

.action-dock {
  position: absolute; right: 30px; bottom: 95px; z-index: 30;
  display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
}
.action-dock[data-side="left"] { right: auto; left: 30px; align-items: flex-start; }

.empty {
  padding: 28px 20px; text-align: center; border: 1px dashed var(--hairline-strong);
  border-radius: 12px; background: var(--surface-soft);
}
.empty .t { font-weight: 700; margin-bottom: 6px; }
.empty .d { font-size: var(--fs-label); color: var(--body); line-height: 1.6; }

.alert-card { padding: 14px 16px; border-bottom: 1px solid var(--hairline); display: flex; gap: 12px; align-items: flex-start; }
.alert-card .body { flex: 1; min-width: 0; }
.alert-card .meta { font-size: var(--fs-caption); color: var(--body); margin-top: 3px; }
.alert-card.undone { background: var(--danger-tint); }
.alert-card.geofence.undone { background: var(--warn-tint); }

.photo-card { border: 1px solid var(--hairline); border-radius: var(--radius-card); overflow: hidden; }
.photo-thumb { height: 300px; background: linear-gradient(135deg,#3C4149,#22262B); display: grid; place-items: center; color: #8A9099; font-size: 13px; }
.meta-grid { display: grid; grid-template-columns: 92px 1fr; gap: 7px 12px; padding: 14px 16px; font-size: var(--fs-label); }
.meta-grid dt { color: var(--body); }
.meta-grid dd { margin: 0; }

.chips { display: flex; flex-wrap: wrap; gap: var(--gap-tap); }
.chip {
  min-height: var(--tap-min); padding: 0 18px; border-radius: var(--radius-pill);
  border: 1px solid var(--hairline-strong); background: var(--canvas);
  font-size: var(--fs-body); font-weight: 700; cursor: pointer; font-family: inherit;
  display: inline-flex; align-items: center;
}
.chip--on { background: var(--primary-subtle); border-color: var(--primary); color: var(--primary); }
/* 등급 칩 — 색 띠 하나로 등급을 말한다. "정상/주의/위험" 글자를 덧붙이지 않는다 */

.src-tag {
  font-size: 12px; line-height: 1; padding: 5px 8px; border-radius: 6px;
  border: 1px solid var(--hairline-strong); color: var(--body); background: var(--surface-soft);
  font-weight: 600; white-space: nowrap;
}

.input-bar { display: flex; gap: var(--gap-tap); align-items: center; margin-top: 12px; }
.input-bar .field {
  flex: 1; min-height: var(--tap-primary); border: 1px solid var(--hairline-strong);
  border-radius: 14px; padding: 0 16px; display: flex; align-items: center;
  color: var(--muted); font-size: var(--fs-body); background: var(--canvas);
}

.outbox-row { display: flex; align-items: center; gap: 12px; min-height: 72px; padding: 12px 16px; border-bottom: 1px solid var(--hairline); }
.outbox-row .body { flex: 1; min-width: 0; }

.canvas-area {
  flex: 1; margin: 0 -30px; background: #2A2E34; position: relative;
  display: grid; place-items: center; color: #7E858E; font-size: 13px;
}
.pen-tools {
  display: flex; gap: 10px; align-items: center; padding: 12px 0 2px;
}

.pen-tool {
  width: var(--tap-primary); height: var(--tap-primary); border-radius: 14px;
  border: 1px solid var(--hairline-strong); background: var(--canvas);
  display: grid; place-items: center; font-size: 19px; cursor: pointer;
}
.pen-tool--on { background: var(--primary); color: #fff; border-color: transparent; }

.hidden { display: none !important; }

/* 아이콘 — 인라인 SVG 스프라이트. 크기는 font-size 대신 width/height */
.ic-svg { display: inline-block; vertical-align: middle; flex: none; }

/* 로그인 계열 — 장갑 낀 손 전제로 크게 */
.field-lg {
  min-height: 72px; border: 1px solid var(--hairline-strong); border-radius: 14px;
  padding: 0 18px; display: flex; align-items: center;
  font-size: var(--fs-title); background: var(--canvas);
}
.otp-box {
  width: 72px; height: 88px; border: 2px solid var(--hairline-strong); border-radius: 14px;
  display: grid; place-items: center; font-size: 32px; font-weight: 800; background: var(--canvas);
}
.otp-box.on { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-ring); }
.site-opt {
  display: flex; align-items: center; gap: 16px; width: 100%;
  min-height: 96px; padding: 16px 20px; cursor: pointer;
  border: 1px solid var(--hairline-strong); border-radius: var(--radius-card);
  background: var(--canvas); font-family: inherit;
}
.site-opt:hover { border-color: var(--primary); background: var(--primary-subtle); }

.legend { margin-top: 20px; font-size: 12px; color: #55595F; line-height: 1.8; max-width: 880px; }
.legend b { color: var(--ink); }
.legend .tag { display: inline-block; background: #DDE0E5; border-radius: 4px; padding: 1px 6px; margin-right: 4px; }
</style>
</head>
<body>
<!-- 아이콘 스프라이트 — 외부 의존 없음. 24×24 stroke 기반.
     Flutter 에서는 같은 의미의 Icons.* 로 대응시킨다(이름을 주석에 남김). -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="i-site" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 12h3.5l2-5 3 10 2.5-7 1.5 2H21"/></g>                        <!-- Icons.monitor_heart -->
  <g id="i-alert" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 9a6 6 0 1 0-12 0c0 5-2 6-2 6h16s-2-1-2-6"/><path d="M10.5 20a2 2 0 0 0 3 0"/></g>  <!-- Icons.notifications -->
  <g id="i-note" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 6h10M4 11h7M4 16h5"/><path d="M14.5 16.5 19 12l2.5 2.5-4.5 4.5H14.5z"/></g>          <!-- Icons.edit_note -->
  <g id="i-outbox" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/><path d="M12 3v11"/><path d="M8 7l4-4 4 4"/></g> <!-- Icons.outbox -->
  <g id="i-right" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 5l7 7-7 7"/></g>                                             <!-- Icons.chevron_right -->
  <g id="i-pen" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/></g>                <!-- Icons.edit / stylus -->
  <g id="i-marker" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 4l5 5-9 9H6v-5z"/><path d="M4 21h16"/></g>                   <!-- 형광펜 -->
  <g id="i-shape" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/></g>
  <g id="i-eraser" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 20H20"/><path d="M14 4l6 6-8 8H7l-3-3z"/></g>
  <g id="i-undo" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 10h10a5 5 0 0 1 0 10h-4"/><path d="M8 6l-4 4 4 4"/></g>       <!-- Icons.undo -->
  <g id="i-refresh" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 11a8 8 0 1 0-1.5 5.5"/><path d="M20 5v6h-6"/></g>            <!-- Icons.refresh -->
  <g id="i-mic" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></g> <!-- Icons.mic -->
  <g id="i-check" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9.5"/></g>     <!-- Icons.task_alt -->
  <g id="i-add" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
    <path d="M12 5v14M5 12h14"/></g>                                          <!-- Icons.add -->
  <g id="i-down" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 9l6 6 6-6"/></g>                                              <!-- Icons.expand_more -->
  <g id="i-clock" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g>                <!-- Icons.schedule -->
</defs></svg>
<div class="shell">

  <nav class="side">
    <h1>현장 태블릿 서비스화면 시안</h1>
    <div class="sub">Lenovo Idea Tab Pro 12.7" · 설계 논리 크기 100%<br>현장 안전관리자(site_manager)</div>

    <div class="grp">진입</div>
    <button data-screen="login" aria-current="true">A-01 로그인</button>
    <button data-screen="totp">A-02 2단계 인증</button>
    <button data-screen="sitepick">A-06 현장 선택</button>

    <div class="grp">주요 화면</div>
    <button data-screen="site">S-01 현장 요약</button>
    <button data-screen="alerts">L-01 경보 목록</button>
    <button data-screen="alert-detail">L-02 경보 상세 · 대응확인</button>
    <button data-screen="alert-offline">L-03 오프라인 — 대응 불가</button>
    <button data-screen="photo">R-03 현장 사진 상세</button>
    <button data-screen="pen">R-04 펜 주석 캔버스</button>
    <button data-screen="input">R-06 입력 3경로</button>
    <button data-screen="outbox">O-01 전송 상태</button>
    <button data-screen="video">V-01 영상</button>

    <div class="grp">빈·실패 상태</div>
    <button data-screen="nocache">S-07 최초 캐시 없음</button>
    <button data-screen="offline">C-01 오프라인 배너</button>

    <div class="note">
      빗금 = 시스템 인셋<br>
      상단 39dp · 하단 15dp · 좌우 30dp(제스처 경합)<br><br>
      ⚠ 이 시안은 <b>모의 동작</b>입니다. 실제 데이터가 아닙니다.
    </div>
  </nav>

  <main class="stage">
    <div class="stage-bar">
      <div class="seg" id="orient">
        <button data-o="portrait" aria-pressed="true">세로 866×1385</button>
        <button data-o="landscape" aria-pressed="false">가로 1385×866</button>
      </div>
      <div class="seg" id="zoom">
        <button data-z="0.5" aria-pressed="true">50%</button>
        <button data-z="0.7" aria-pressed="false">70%</button>
        <button data-z="1" aria-pressed="false">100%</button>
      </div>
      <div class="seg" id="insets">
        <button data-i="on" aria-pressed="true">인셋 표시</button>
        <button data-i="off" aria-pressed="false">숨김</button>
      </div>
      <div class="seg" id="dock">
        <button data-d="right" aria-pressed="true">실행 우측</button>
        <button data-d="left" aria-pressed="false">실행 좌측</button>
      </div>
      <div class="stage-meta" id="meta"></div>
    </div>

    <div class="device portrait" id="device">
      <div class="screen" id="screen" data-insets="on">
        <div class="inset-status">상태바 39dp</div>
        <div class="inset-edge l"></div>
        <div class="inset-edge r"></div>
        <div class="inset-nav"></div>

        <div class="app">
          <!-- 공통 상단 -->
          <header class="app-top">
            <div class="top-line1">
              <span class="site-chip">광주 스마트인재개발원 신축<svg class="ic-svg caret" id="siteCaret" width="18" height="18" viewBox="0 0 24 24" hidden><use href="#i-down"/></svg></span>
              <span class="top-right">
                <span class="stale num"><svg class="ic-svg" width="15" height="15" viewBox="0 0 24 24"><use href="#i-clock"/></svg>마지막 수신 12:10</span>
              </span>
            </div>
            <!-- 스트립 슬롯은 항상 예약된다 — 경보가 와도 캔버스 높이가 변하지 않게 -->
            <div class="alert-strip" id="strip">
              <span class="dot dot--danger" title="위험"></span>
              <span class="grow t-body"><b>새 경보 2건</b> · 구획 이탈 장우진 · 생체 위험 1건</span>
              <button class="btn">경보 보기</button>
            </div>
          </header>

          <section class="app-body scroll" id="body"></section>

          <!-- 실행 독 — 한 벌만. 좌/우 배치는 선택 -->
          <div class="action-dock" id="adock" data-side="right"></div>

          <nav class="app-tabs" id="tabs">
            <button aria-current="true"><svg class="ic-svg ic" width="24" height="24" viewBox="0 0 24 24"><use href="#i-site"/></svg>현장</button>
            <button><svg class="ic-svg ic" width="24" height="24" viewBox="0 0 24 24"><use href="#i-alert"/></svg>경보<span class="tab-badge num">2</span></button>
            <button><svg class="ic-svg ic" width="24" height="24" viewBox="0 0 24 24"><use href="#i-note"/></svg>기록</button>
            <button><svg class="ic-svg ic" width="24" height="24" viewBox="0 0 24 24"><use href="#i-outbox"/></svg>전송 상태</button>
          </nav>
        </div>
      </div>
    </div>

    <div class="legend" id="legend"></div>
  </main>
</div>

<script>
/* ── 화면 정의 ────────────────────────────────────────────── */
const SCREENS = {

login: {
  title: "A-01 로그인",
  chrome: false,

/* ── 뷰어 동작 ────────────────────────────────────────────── */
const $ = s => document.querySelector(s);
const device = $("#device"), screen = $("#screen"), body = $("#body"),
      adock = $("#adock"), legend = $("#legend"), meta = $("#meta"), strip = $("#strip");

let cur = "login";

function render() {
  const s = SCREENS[cur];
  const noChrome = s.chrome === false;
  document.querySelector(".app-top").classList.toggle("hidden", noChrome);
  document.querySelector("#tabs").classList.toggle("hidden", noChrome);
  body.classList.toggle("scroll", !noChrome);
  body.style.display = noChrome ? "flex" : "";
  body.style.flexDirection = noChrome ? "column" : "";
  body.innerHTML = s.body;
  adock.innerHTML = s.dock || "";
  legend.innerHTML = `<b>${s.title}</b> — ${s.note}`;
  body.scrollTop = 0;
  if (noChrome) { updateMeta(); return; }
  // 경보 스트립은 오프라인 화면에서 숨기지 않고 상태만 바꾼다(슬롯 예약 유지)
  const quiet = (cur === "offline" || cur === "nocache" || cur === "alert-offline");
  strip.dataset.empty = quiet ? "true" : "false";
  strip.innerHTML = quiet
    ? `<span class="dot dot--idle" title="보류"></span><span class="grow t-label">연결되면 새 경보를 확인합니다</span>`
    : `<span class="dot dot--danger" title="위험"></span>
       <span class="grow t-body"><b>새 경보 2건</b> · 구획 이탈 장우진 · 생체 위험 1건</span>
       <button class="btn">경보 보기</button>`;
  updateMeta();
}

function updateMeta() {
  const land = device.classList.contains("landscape");
  const w = land ? 1385 : 866, h = land ? 866 : 1385;
  meta.innerHTML = `전체 <code>${w}×${h}dp</code> · 안전 <code>${w}×${h - 54}dp</code>`
    + (land ? "" : ` · IME 뜨면 <code>866×978dp</code>`);
}

document.querySelectorAll(".side button").forEach(b => {
  b.addEventListener("click", () => {
    document.querySelectorAll(".side button").forEach(x => x.removeAttribute("aria-current"));
    b.setAttribute("aria-current", "true");
    cur = b.dataset.screen; render();
  });
});

$("#orient").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  device.classList.toggle("landscape", b.dataset.o === "landscape");
  device.classList.toggle("portrait",  b.dataset.o === "portrait");
  [...e.currentTarget.children].forEach(x => x.setAttribute("aria-pressed", x === b));
  updateMeta();
});

$("#zoom").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  device.style.zoom = b.dataset.z;
  [...e.currentTarget.children].forEach(x => x.setAttribute("aria-pressed", x === b));
});

$("#insets").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  screen.dataset.insets = b.dataset.i;
  [...e.currentTarget.children].forEach(x => x.setAttribute("aria-pressed", x === b));
});

$("#dock").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  adock.dataset.side = b.dataset.d;
  [...e.currentTarget.children].forEach(x => x.setAttribute("aria-pressed", x === b));
});

document.querySelector("#tabs").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  [...e.currentTarget.children].forEach(x => x.removeAttribute("aria-current"));
  b.setAttribute("aria-current", "true");
});

device.style.zoom = "0.5";
render();
</script>
</body>
</html>
