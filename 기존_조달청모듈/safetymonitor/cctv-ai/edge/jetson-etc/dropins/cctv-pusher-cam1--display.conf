# 표시(푸시 JPEG) 크기 640x360 → 960x540 (2026-09-18 · 사용자 지시 C).
# 종전에 640x360 으로 묶어 둔 이유는 「Cloud Run 으로 밀 때 대역폭·과금」이었다.
# 09-18 관제웹이 젯슨 게이트에 직결(00402-t5n)돼 그 근거가 사라졌다 — Tailscale 실측 약 4MB/s.
# 코드 e451c5cf 부터 DISPLAY_SIZE env 를 읽는다. 그 전 코드는 이 값을 무시한다.
# 되돌리기: 이 파일 삭제 → daemon-reload → restart (640x360 으로 돌아간다)
[Service]
Environment=DISPLAY_SIZE=960x540
