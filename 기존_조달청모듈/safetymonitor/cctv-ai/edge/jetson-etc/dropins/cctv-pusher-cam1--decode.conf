# 하드웨어 디코딩(2026-09-18) — h264 를 CPU 가 아니라 젯슨 전용 칩(nvv4l2decoder)으로 푼다.
# 실측: 디코딩만 따로 돌렸을 때 ffmpeg 25.94fps/CPU 100.5% vs gst 25.31fps/CPU 47.2%.
# 그 CPU 여유가 추론으로 간다 — 종전 푸셔는 한 스레드가 디코딩과 추론을 같이 해 8.4fps 였다.
# ⚠ gst 경로는 PTS 조회가 안 돼 health 의 input_lag_s 가 사라진다. 「지연 0」이 아니라 「못 잼」이다.
# 되돌리기: 이 파일 삭제 → daemon-reload → restart
[Service]
Environment=CAP_BACKEND=gst
