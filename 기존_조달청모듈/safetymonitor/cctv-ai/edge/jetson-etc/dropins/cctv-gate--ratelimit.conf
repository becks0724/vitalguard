# 게이트 요청 한도 임시 상향 (2026-09-18 · 사용자 지시)
#
# 왜 — CAM-01 이 엔진 재굽기로 내려가 있는 동안 브라우저가 /cctv/stream1 을 초당 2건 이상
#      재시도한다. 한도는 **IP 하나당 분당 120건**(cctv_gate.py:58,151-159)이고 넘치면
#      before_request 가 **모든 경로**에 429 를 준다 — CAM-03 이 덩달아 막혔다.
#      실측 최근 60초: stream1 57건 · stream3 3건 · stats3 3건.
#
# 되돌리기 — 이 파일을 지우고 daemon-reload + restart 하면 기본 120 으로 돌아간다.
#            CAM-01 이 올라오면 재시도가 멎으므로 그때 되돌려도 된다.
[Service]
Environment=GATE_RATE_PER_MIN=600
