# 표시(푸시 JPEG) 크기 640x360 → 960x540 (2026-09-18). CAM-01(2호기)과 같은 크기로 맞춘다.
# 근거는 2호기 display.conf 와 같다 — 직결(00402-t5n)로 바뀌어 「대역폭 불변」 전제가 사라졌다.
# 코드 e451c5cf 부터 DISPLAY_SIZE env 를 읽는다. ⚠ 값 형식은 반드시 WxH (예 960x540) — 틀리면 기동이 실패한다.
# 되돌리기: 이 파일 삭제 → daemon-reload → restart
[Service]
Environment=DISPLAY_SIZE=960x540
