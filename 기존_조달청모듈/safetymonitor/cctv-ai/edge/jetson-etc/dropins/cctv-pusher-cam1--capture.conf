# ⚠ 2026-09-18 16:43 부터 decode.conf(CAP_BACKEND=gst) 가 켜져 있어 이 파일은 읽히지 않는다 — OPENCV_FFMPEG_CAPTURE_OPTIONS 는 CAP_FFMPEG 전용. ffmpeg 로 되돌릴 때만 산다.
# 새 자리 CAM-01 은 영상이 무겁다(701KB/s · 옛 자리 128KB/s). 코드 기본값은 버퍼가 0이라
# GoPro 에는 맞았지만 여기서는 조각이 깨진다(60초 13건). 되돌리기 = 이 파일 삭제.
[Service]
Environment=OPENCV_FFMPEG_CAPTURE_OPTIONS=rtsp_transport;tcp|probesize;1000000|analyzeduration;500000|max_delay;500000
