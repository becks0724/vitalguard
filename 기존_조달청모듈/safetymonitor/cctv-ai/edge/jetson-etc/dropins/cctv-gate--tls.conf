# Tailscale 이름으로 붙을 때 인증서가 맞게 한다 (2026-09-18).
#
# 기존 인증서는 cctv-gate.example.invalid / tablet-cam.example.invalid 용이다.
# 관제웹이 https://jetson-1.tailnet.invalid:8443 로 붙으면 이름이 안 맞아 브라우저가 막는다.
# 이 인증서는 Tailscale 이 발급한 것이고 2026-10-27 까지 유효하다.
#
# ★ 왜 Tailscale 이름인가 — duckdns 는 공유기 구멍(NAT-PMP)에 기대는데 2시간마다 갱신이 필요하고
#   09-18 16:41 에 「2시간 경과 — 갱신 중단」으로 닫혔다. Tailscale 은 그 구멍이 필요 없다.
#
# ⚠ 대가 — duckdns 이름으로 오는 접속은 인증서 경고를 받는다.
#   09-18 사용자 「맥에서만 본다」 전제에서만 맞는 선택이다. 태블릿·폰이 보기 시작하면 되돌린다.
#
# 되돌리기: 이 파일 삭제 → daemon-reload → restart
[Service]
Environment=GATE_TLS_CERT=/home/jetson/jetson-1.tailnet.invalid.crt
Environment=GATE_TLS_KEY=/home/jetson/jetson-1.tailnet.invalid.key
