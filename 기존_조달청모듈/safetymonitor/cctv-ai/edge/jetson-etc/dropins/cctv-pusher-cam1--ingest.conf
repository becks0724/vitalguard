# CAM-01 서버 중계 — 2호기가 관제웹 서버 /api/cctv-gate/cctv/ingest1 로 5초마다 JPEG 를 민다.
#
# ⛔ 적용 순서 — 서버 배포 → 런타임 env → 이 파일. 먼저 켜면 ingest1 이 404 라 오류만 쌓인다.
# 적용:   sudo cp ~/ingest.conf.pending /etc/systemd/system/cctv-pusher-cam1.service.d/ingest.conf
#         sudo systemctl daemon-reload && sudo systemctl restart cctv-pusher-cam1
# 되돌리기: 그 파일 삭제 → daemon-reload → restart (CCTV_BASE 가 사라지면 push 자체를 안 한다 · 과금 0)
#
# PUSH_FPS 0.2 = 5초 1장. CAM-03 과 같게 둔다 — 다르면 과금·부하 추정 식이 갈린다([M/L] 합의).
[Service]
EnvironmentFile=/home/jetson/.cctv_ingest.env
# ⏸ 2026-09-18 18:2x 서버중계 끔 — 관제웹이 젯슨 게이트 직결(00402-t5n)로 바뀌어 과금이 붙는 이 경로가 필요 없다.
#   빈 값이면 코드 :884 if not CCTV_BASE: return 으로 푸시 워커가 아예 안 뜬다([M/L] 확인). 파일은 되돌리기용으로 남긴다.
#   되돌리기: 아래 줄을 bak-0918-relay-on 의 값으로 되돌리고 daemon-reload → restart
Environment=CCTV_BASE=
Environment=PUSH_FPS=0.2
