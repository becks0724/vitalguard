# CAM-03 서버 중계(2026-09-17) — 푸셔가 관제웹 서버 /api/cctv-gate/cctv/ingest3 로 5초마다 JPEG 를 민다.
# 되돌리기: 이 파일 삭제 → daemon-reload → restart (CCTV_BASE 가 사라지면 push 자체를 안 한다 · 과금 0)
[Service]
EnvironmentFile=/home/jetson/.cctv_ingest.env
# ⏸ 2026-09-18 18:2x 서버중계 끔 — 관제웹이 젯슨 게이트 직결(00402-t5n)로 바뀌어 과금이 붙는 이 경로가 필요 없다.
#   빈 값이면 코드 :884 if not CCTV_BASE: return 으로 푸시 워커가 아예 안 뜬다([M/L] 확인). 파일은 되돌리기용으로 남긴다.
#   되돌리기: 아래 줄을 bak-0918-relay-on 의 값으로 되돌리고 daemon-reload → restart
