<title>이음새 배선도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">

<style>
  /* ── 단일 다크 세계 ─────────────────────────────────────────────────────
     노드 에디터는 링크와 포트가 바탕에서 떠 보여야 성립한다. 그래서 테마를
     따라가지 않고 한 세계로 고정하되, 모든 색을 명시해 호스트 바탕이 비쳐
     들어오지 않게 한다. */
  :root {
    --void:      #0b0f14;
    --grid:      #16202b;
    --panel:     #131a22;
    --panel-2:   #0f151c;
    --rail:      #22303e;
    --rail-soft: #1a242f;
    --ink:       #dde5ee;
    --ink-2:     #9fb0c2;
    --ink-3:     #6b7c8e;

    --rt-app:  #f0883e;
    --rt-edge: #4fc3d9;
    --rt-web:  #9d7cf4;
    --rt-pod:  #e05c6e;
    --rt-ext:  #7d8b9c;

    /* 계약 강도 — 이 자료의 요지가 여기 실린다. 장식이 아니라 정보다. */
    --hard: #3fb950;
    --soft: #d2a022;

    --f-ui:   "Archivo", "IBM Plex Sans KR", system-ui, sans-serif;
    --f-kr:   "IBM Plex Sans KR", "Archivo", system-ui, sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--void);
    color: var(--ink);
    font-family: var(--f-kr);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  #app {
    display: grid;
    grid-template-rows: auto 1fr;
    grid-template-columns: 1fr 330px;
    grid-template-areas: "bar bar" "canvas side";
    height: 100vh;
  }

  /* ── 상단 바 ─────────────────────────────────────────────────────────── */
  header {
    grid-area: bar;
    display: flex;
    align-items: center;
    gap: 22px;
    flex-wrap: wrap;
    padding: 10px 16px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--rail);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  h1 {
    font-family: var(--f-ui);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: -0.01em;
    margin: 0;
    color: var(--ink);
  }
  .sub {
    font-family: var(--f-mono);
    font-size: 10.5px;
    color: var(--ink-3);
    letter-spacing: 0.04em;
  }

  .tally { display: flex; gap: 0; border: 1px solid var(--rail); border-radius: 4px; overflow: hidden; }
  .tally div { padding: 3px 11px; border-right: 1px solid var(--rail); }
  .tally div:last-child { border-right: 0; }
  .tally dt {
    font-family: var(--f-mono);
    font-size: 9px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 0;
  }
  .tally dd {
    margin: 0;
    font-family: var(--f-ui);
    font-weight: 700;
    font-size: 15px;
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
  }
  .tally dd span { font-size: 10px; font-weight: 400; color: var(--ink-3); margin-left: 3px; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; align-items: center; margin-left: auto; }
  .lg { display: flex; align-items: center; gap: 12px; }
  .lg-title {
    font-family: var(--f-mono);
    font-size: 9px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--ink-2); }
  .chip i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .chip.line i { width: 16px; height: 2px; border-radius: 1px; }

  /* ── 캔버스 ─────────────────────────────────────────────────────────── */
  #canvas {
    grid-area: canvas;
    position: relative;
    overflow: hidden;
    cursor: grab;
    background-color: var(--void);
    background-image: radial-gradient(var(--grid) 1px, transparent 1px);
    background-size: 22px 22px;
    touch-action: none;
  }
  #canvas.dragging { cursor: grabbing; }
  #world { position: absolute; inset: 0; transform-origin: 0 0; }
  #links { position: absolute; left: 0; top: 0; z-index: 2; overflow: visible; pointer-events: none; }
  #links path { pointer-events: stroke; }

  /* 그룹 테두리는 장식이다 — 포인터를 먹으면 그 아래 링크를 못 고른다.
     (실제로 여기에 걸려 링크 클릭이 통째로 죽어 있었다. 보이기는 멀쩡했다.) */
  .grp {
    position: absolute;
    z-index: 1;
    pointer-events: none;
    border: 1px dashed var(--rail);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.012);
  }
  .grp b {
    position: absolute;
    top: -9px;
    left: 14px;
    padding: 0 7px;
    background: var(--void);
    font-family: var(--f-mono);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.09em;
  }

  .node {
    position: absolute;
    z-index: 3;
    width: 208px;
    background: var(--panel);
    border: 1px solid var(--rail);
    border-radius: 7px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
    font-size: 11px;
    user-select: none;
  }
  .node:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .node.sel { border-color: var(--ink-2); box-shadow: 0 0 0 1px var(--ink-2), 0 8px 24px rgba(0,0,0,.55); }
  .node.dim { opacity: 0.34; }
  .node .hd {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 9px;
    border-radius: 6px 6px 0 0;
    font-family: var(--f-ui);
    font-weight: 600;
    font-size: 11.5px;
    letter-spacing: -0.005em;
    color: #0b0f14;
  }
  .node .hd em { font-style: normal; font-family: var(--f-mono); font-size: 9px; opacity: .62; margin-left: auto; }
  .node .bd { padding: 6px 0 7px; }
  .node .meta {
    padding: 0 9px 5px;
    font-family: var(--f-mono);
    font-size: 9.5px;
    color: var(--ink-3);
    line-height: 1.5;
  }
  .port {
    display: flex;
    align-items: center;
    gap: 6px;
    height: 19px;
    padding: 0 9px;
    font-family: var(--f-mono);
    font-size: 9.5px;
    color: var(--ink-2);
    position: relative;
  }
  .port.out { justify-content: flex-end; text-align: right; }
  .port .dot {
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    border: 1.5px solid var(--void);
  }
  .port.in .dot  { left: -5px; }
  .port.out .dot { right: -5px; }

  /* ── 인스펙터 ───────────────────────────────────────────────────────── */
  aside {
    grid-area: side;
    background: var(--panel-2);
    border-left: 1px solid var(--rail);
    overflow-y: auto;
    padding: 16px 16px 40px;
  }
  .ins-kicker {
    font-family: var(--f-mono);
    font-size: 9.5px;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 7px;
  }
  .ins-title {
    font-family: var(--f-ui);
    font-weight: 700;
    font-size: 17px;
    line-height: 1.3;
    margin: 0 0 3px;
    text-wrap: balance;
    word-break: keep-all;   /* 한국어는 낱말 중간에서 끊으면 안 된다 */
  }
  .ins-rt { font-family: var(--f-mono); font-size: 10.5px; color: var(--ink-3); }
  .badge {
    display: inline-block;
    margin-top: 11px;
    padding: 2px 9px;
    border-radius: 999px;
    font-family: var(--f-mono);
    font-size: 10px;
    font-weight: 500;
    border: 1px solid currentColor;
  }
  .fld { margin-top: 16px; }
  .fld dt {
    font-family: var(--f-mono);
    font-size: 9.5px;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin-bottom: 4px;
  }
  .fld dd { margin: 0; font-size: 12.5px; line-height: 1.62; color: var(--ink-2); word-break: keep-all; }
  .fld dd.break { color: #e8b04b; }
  .fld dd.none { color: var(--ink-3); }
  /* 호출 지점 — grep 원문 그대로다. 줄바꿈을 살리되 가로는 스스로 스크롤한다. */
  .site-sec {
    font-family: var(--f-mono);
    font-size: 9.5px;
    color: var(--ink-3);
    margin: 9px 0 3px;
  }
  pre.sites {
    margin: 0;
    padding: 7px 8px;
    background: var(--panel);
    border: 1px solid var(--rail-soft);
    border-radius: 4px;
    font-family: var(--f-mono);
    font-size: 9.5px;
    line-height: 1.62;
    color: var(--ink-2);
    white-space: pre;
    overflow-x: auto;
  }
  .fld dd em { font-style: normal; color: var(--ink); font-weight: 500; }
  code, .mono {
    font-family: var(--f-mono);
    font-size: 0.9em;
    background: var(--panel);
    border: 1px solid var(--rail-soft);
    padding: 0 4px;
    border-radius: 3px;
    word-break: break-word;
  }
  .thesis { font-size: 12.5px; line-height: 1.68; color: var(--ink-2); word-break: keep-all; }
  .thesis strong { color: var(--ink); font-weight: 600; }
  .hint {
    margin-top: 20px;
    padding-top: 13px;
    border-top: 1px solid var(--rail-soft);
    font-family: var(--f-mono);
    font-size: 10px;
    line-height: 1.8;
    color: var(--ink-3);
  }
  .hint kbd {
    font-family: var(--f-mono);
    font-size: 9.5px;
    border: 1px solid var(--rail);
    border-bottom-width: 2px;
    border-radius: 3px;
    padding: 0 4px;
    color: var(--ink-2);
  }

  .zoom {
    position: absolute;
    right: 12px; bottom: 12px;
    display: flex;
    gap: 1px;
    border: 1px solid var(--rail);
    border-radius: 5px;
    overflow: hidden;
    background: var(--rail);
  }
  .zoom button {
    font-family: var(--f-mono);
    font-size: 11px;
    color: var(--ink-2);
    background: var(--panel);
    border: 0;
    padding: 5px 10px;
    cursor: pointer;
  }
  .zoom button:hover { background: var(--rail-soft); color: var(--ink); }
  .zoom button:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }

  @media (prefers-reduced-motion: no-preference) {
    .node, #links path { transition: opacity .16s ease; }
  }
  @media (max-width: 860px) {
    #app { grid-template-columns: 1fr; grid-template-areas: "bar" "canvas" ; }
    aside { display: none; }
  }
</style>

<div id="app">
  <header>
    <div class="brand">
      <h1>이음새 배선도</h1>
      <span class="sub">VitAlGuard · 2026-08-21</span>
    </div>

    <dl class="tally">

        <span class="chip"><i style="background:var(--rt-web)"></i>관제웹 TS</span>
        <span class="chip"><i style="background:var(--rt-pod)"></i>가스포드 C++</span>
        <span class="chip"><i style="background:var(--rt-ext)"></i>외부</span>

        <span class="chip line"><i style="background:var(--soft)"></i>합의뿐</span>
      </div>
    </div>
  </header>

  <div id="canvas">
    <div id="world">
      <svg id="links"></svg>
    </div>
    <div class="zoom">
      <button type="button" data-z="out" aria-label="축소">−</button>

      <button type="button" data-z="in" aria-label="확대">＋</button>
    </div>
  </div>

  <aside id="inspector" aria-live="polite"></aside>
</div>

  const INNER = [

    ["rVital", 0, "store", 0], ["rPod", 0, "store", 1],
    ["rMedia", 0, "obj", 0],
  ];

  const GROUPS = [
    { rt: "app",  label: "폰 · 워치 앱", ids: ["watch", "recv", "pipe", "bridge", "media", "dart"] },
    { rt: "edge", label: "현장 엣지",     ids: ["jetson", "cctvai"] },

  ];

  const NW = 208, HD = 27, PORT_H = 19, PAD_TOP = 6;
  const byId = new Map(NODES.map((n) => [n.id, n]));

  /** 포트 중심의 월드 좌표. 입력은 왼쪽 변, 출력은 오른쪽 변. */
  function portPos(nodeId, kind, idx) {
    const n = byId.get(nodeId);
    const rows = kind === "in" ? 0 : (n.in ? n.in.length : 0);
    const y = n.y + HD + PAD_TOP + (rows + idx) * PORT_H + PORT_H / 2;
    return { x: kind === "in" ? n.x : n.x + NW, y };
  }

  function nodeHeight(n) {
    const rows = (n.in ? n.in.length : 0) + (n.out ? n.out.length : 0);
    return HD + PAD_TOP + rows * PORT_H + (n.m ? 17 : 0) + 7;
  }

  const world = document.getElementById("links").parentNode;
  const svg = document.getElementById("links");
  // ★ SVG 에 크기를 주지 않으면 기본 300×150 박스가 된다. `overflow:visible` 이라 바깥 선도
  //   **보이기는 하는데 히트테스트가 그 박스에서 잘린다** — 눈으로는 멀쩡하고 클릭만 죽는다.
  //   그래서 월드 전체를 덮도록 명시한다.
  {

  for (const g of GROUPS) {
    const ns = g.ids.map((i) => byId.get(i));
    const x1 = Math.min(...ns.map((n) => n.x)) - 20;
    const y1 = Math.min(...ns.map((n) => n.y)) - 26;
    const x2 = Math.max(...ns.map((n) => n.x + NW)) + 20;
    const y2 = Math.max(...ns.map((n) => n.y + nodeHeight(n))) + 20;
    const el = document.createElement("div");
    el.className = "grp";
    el.style.cssText = `left:${x1}px;top:${y1}px;width:${x2 - x1}px;height:${y2 - y1}px`;
    const b = document.createElement("b");
    b.textContent = g.label;
    b.style.color = RT[g.rt].hue;
    el.appendChild(b);
    world.appendChild(el);
  }

  const nodeEls = new Map();
  for (const n of NODES) {
    const el = document.createElement("div");
    el.className = "node";
    el.tabIndex = 0;
    el.style.cssText = `left:${n.x}px;top:${n.y}px`;
    el.dataset.node = n.id;

    const hue = RT[n.rt].hue;
    let html = `<div class="hd" style="background:${hue}">${n.t}</div><div class="bd">`;
    (n.in || []).forEach((p) => {
      html += `<div class="port in"><span class="dot" style="background:${hue}"></span>${p}</div>`;
    });
    (n.out || []).forEach((p) => {
      html += `<div class="port out">${p}<span class="dot" style="background:${hue}"></span></div>`;
    });
    if (n.m) html += `<div class="meta">${n.m}</div>`;
    html += "</div>";
    el.innerHTML = html;
    world.appendChild(el);
    nodeEls.set(n.id, el);
  }

  /** 베지어 — 노드 에디터의 관용 곡선. 수평 거리에 비례해 손잡이를 늘린다. */
  function curve(a, b) {
    const dx = Math.max(60, Math.abs(b.x - a.x) * 0.5);
    return `M ${a.x} ${a.y} C ${a.x + dx} ${a.y}, ${b.x - dx} ${b.y}, ${b.x} ${b.y}`;
  }

  for (const [fa, fi, ta, ti] of INNER) {
    const p = document.createElementNS(SVGNS, "path");
    p.setAttribute("d", curve(portPos(fa, "out", fi), portPos(ta, "in", ti)));
    p.setAttribute("fill", "none");
    p.setAttribute("stroke", "#2c3b4b");
    p.setAttribute("stroke-width", "1.6");
    svg.appendChild(p);
  }

  const linkEls = new Map();
  for (const L of LINKS) {
    const a = portPos(L.from[0], "out", L.from[1]);
    const b = portPos(L.to[0], "in", L.to[1]);
    const color = L.hard ? "#3fb950" : "#d2a022";
    const d = curve(a, b);

    const hit = document.createElementNS(SVGNS, "path");
    hit.setAttribute("d", d);
    hit.setAttribute("fill", "none");
    hit.setAttribute("stroke", "transparent");
    hit.setAttribute("stroke-width", "16");
    hit.style.cursor = "pointer";
    hit.dataset.link = L.id;
    svg.appendChild(hit);

    const p = document.createElementNS(SVGNS, "path");
    p.setAttribute("d", d);
    p.setAttribute("fill", "none");
    p.setAttribute("stroke", color);
    p.setAttribute("stroke-width", "2.2");
    if (L.dashed) p.setAttribute("stroke-dasharray", "6 5");
    p.style.pointerEvents = "none";
    svg.appendChild(p);

    const mid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 - 12 };
    const g = document.createElementNS(SVGNS, "g");
    g.style.pointerEvents = "none";
    const bg = document.createElementNS(SVGNS, "circle");
    bg.setAttribute("cx", mid.x); bg.setAttribute("cy", mid.y); bg.setAttribute("r", "10");
    bg.setAttribute("fill", "#0b0f14"); bg.setAttribute("stroke", color); bg.setAttribute("stroke-width", "1.4");
    const tx = document.createElementNS(SVGNS, "text");
    tx.setAttribute("x", mid.x); tx.setAttribute("y", mid.y + 4);
    tx.setAttribute("text-anchor", "middle");
    tx.setAttribute("fill", color);
    tx.setAttribute("font-size", "11");
    tx.setAttribute("font-family", "JetBrains Mono, monospace");
    tx.textContent = L.id;
    g.appendChild(bg); g.appendChild(tx);
    svg.appendChild(g);

    linkEls.set(L.id, { hit, p, g });
  }

      <span style="color:var(--ink-3)">문안 원본 · <code style="font-size:9px">docs/seams.md</code> 표 (2026-08-21)</span>
    </div>`;

  function esc(s) { return String(s).replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c])); }

  function showThesis() { inspector.innerHTML = THESIS; }

  /**
   * 호출 지점 색인 — `docs/seams-callsites.md` 가 grep 으로 뽑아 둔 실제 파일:줄.
   *
   * ⚠ 색인은 수단별(HTTP·WCSession·채널·DB)로 묶여 있어 이음새와 1:1 이 아니다.
   *   그래서 절 이름을 함께 보인다 — 이 이음새 그 자체인지 인접한 조각인지 독자가 가른다.
   * ⚠ 없으면 "없음" 이라고 적는다. 0 건도 사실이다(K·L 은 코드 경로가 실제로 없다).
   */
  function sitesHtml(L) {
    if (!L.sites || !L.sites.length) {
      return `<dl class="fld"><dt>호출 지점</dt><dd class="none">색인에 없음 —
        <code>docs/seams-callsites.md</code> 는 grep 으로 찾은 것만 적는다</dd></dl>`;
    }
    const groups = L.sites.map((g) => `
      <div class="site-sec">${esc(g.sec)}</div>
      <pre class="sites">${g.lines.map(esc).join("\n")}</pre>`).join("");
    const n = L.sites.reduce((a, g) => a + g.lines.length, 0);
    return `<dl class="fld"><dt>호출 지점 ${n}</dt><dd>${groups}</dd></dl>`;
  }

  function showLink(id) {
    const L = LINKS.find((x) => x.id === id);
    const color = L.hard ? "var(--hard)" : "var(--soft)";
    inspector.innerHTML = `
      <div class="ins-kicker">이음새 ${L.id}</div>
      <h2 class="ins-title">${L.name}</h2>
      <div class="ins-rt">${L.rt} · 지도 표기 ${L.map}</div>
      <span class="badge" style="color:${color}">${L.hard ? "코드가 값을 검사한다" : "합의뿐 — 어긋나도 조용하다"}</span>
      <dl class="fld"><dt>수단 · 주기</dt><dd>${L.how}</dd></dl>
      <dl class="fld"><dt>계약이 사는 곳</dt><dd>${L.where}</dd></dl>
      <dl class="fld"><dt>깨지면 보이는 모습</dt><dd class="break">${L.broken}</dd></dl>
      ${sitesHtml(L)}`;
  }

  function showNode(id) {
    const n = byId.get(id);
    const touching = LINKS.filter((L) => L.from[0] === id || L.to[0] === id);
    const rows = touching.length
      ? touching.map((L) => {
          const dir = L.from[0] === id ? "→" : "←";
          const other = byId.get(L.from[0] === id ? L.to[0] : L.from[0]);
          const color = L.hard ? "var(--hard)" : "var(--soft)";
          return `<div style="display:flex;gap:8px;align-items:baseline;padding:3px 0">
            <span style="color:${color};font-family:var(--f-mono);font-size:12px">${L.id}</span>
            <span style="color:var(--ink-3)">${dir}</span>
            <span>${esc(other.t)}</span></div>`;
        }).join("")
      : `<span style="color:var(--ink-3)">이 노드는 런타임 경계를 건너지 않는다.</span>`;
    inspector.innerHTML = `
      <div class="ins-kicker">노드</div>
      <h2 class="ins-title">${esc(n.t)}</h2>
      <div class="ins-rt">${RT[n.rt].label}</div>
      ${n.m ? `<dl class="fld"><dt>구성</dt><dd><code>${esc(n.m)}</code></dd></dl>` : ""}
      <dl class="fld"><dt>물린 이음새 ${touching.length}</dt><dd>${rows}</dd></dl>`;
  }

  let selected = null;

  function applyDim(keepNodes, keepLinks) {
    for (const [id, el] of nodeEls) el.classList.toggle("dim", keepNodes !== null && !keepNodes.has(id));
    for (const [id, o] of linkEls) {
      const on = keepLinks === null || keepLinks.has(id);
      o.p.style.opacity = on ? "1" : "0.16";
      o.g.style.opacity = on ? "1" : "0.16";
    }
    for (const [id, el] of nodeEls) el.classList.toggle("sel", selected === "node:" + id);
  }

  function selectLink(id) {
    selected = "link:" + id;
    const L = LINKS.find((x) => x.id === id);
    applyDim(new Set([L.from[0], L.to[0]]), new Set([id]));
    showLink(id);
  }

  function selectNode(id) {
    selected = "node:" + id;
    const touching = LINKS.filter((L) => L.from[0] === id || L.to[0] === id);
    const keepN = new Set([id]);
    const keepL = new Set();
    for (const L of touching) { keepN.add(L.from[0]); keepN.add(L.to[0]); keepL.add(L.id); }
    applyDim(keepN, keepL);
    showNode(id);
  }

  function clearSel() {
    selected = null;
    applyDim(null, null);
    showThesis();
  }

  canvas.addEventListener("click", (e) => {
    if (panned) { panned = false; return; }   // 팬의 끝은 클릭이 아니다
    const link = e.target.closest("[data-link]");
    if (link) { selectLink(link.dataset.link); return; }
    const node = e.target.closest("[data-node]");
    if (node) { selectNode(node.dataset.node); return; }
    clearSel();
  });
  canvas.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      const node = e.target.closest("[data-node]");
      if (node) { e.preventDefault(); selectNode(node.dataset.node); }
    }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") clearSel(); });

  // ── 팬·줌 ───────────────────────────────────────────────────────────
  let tx = 0, ty = 0, scale = 1;
  function apply() { world.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`; }

  /**
   * 전체를 화면에 맞춘다. `floor` 를 주면 그 아래로는 줄이지 않는다.
   *
   * ★ 여덟 열이라 전체 맞춤은 0.55배가 되어 라벨이 안 읽힌다. 그래서 첫 화면은
   *   바닥값을 걸고 **왼쪽 위에 붙여** 연다 — 흐름이 시작되는 곳(워치)부터 보이고,
   *   나머지는 팬으로 따라간다. 노드 에디터의 관용이기도 하다.
   *   전체 조망이 필요하면 [맞춤] 이 바닥값 없이 다시 잡는다.
   */
  function fit(floor = 0) {
    const x1 = Math.min(...NODES.map((n) => n.x)) - 56;
    const y1 = Math.min(...NODES.map((n) => n.y)) - 46;
    const x2 = Math.max(...NODES.map((n) => n.x + NW)) + 56;
    const y2 = Math.max(...NODES.map((n) => n.y + nodeHeight(n))) + 46;
    const r = canvas.getBoundingClientRect();
    const raw = Math.min(r.width / (x2 - x1), r.height / (y2 - y1), 1.4);
    scale = Math.max(raw, floor);
    if (scale > raw) {
      // 바닥값에 걸렸다 = 다 안 들어간다. 가운데 정렬 대신 시작점에 붙인다.
      tx = -x1 * scale + 16;
      ty = -y1 * scale + Math.max(0, (r.height - (y2 - y1) * scale) / 2);
    } else {
      tx = -x1 * scale + (r.width - (x2 - x1) * scale) / 2;
      ty = -y1 * scale + (r.height - (y2 - y1) * scale) / 2;
    }
    apply();
  }

  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    const cx = e.clientX - r.left, cy = e.clientY - r.top;
    const next = Math.min(2.6, Math.max(0.18, scale * (e.deltaY < 0 ? 1.12 : 1 / 1.12)));
    tx = cx - (cx - tx) * (next / scale);
    ty = cy - (cy - ty) * (next / scale);
    scale = next;
    apply();
  }, { passive: false });

  let drag = null;
  let panned = false;   // 방금 팬을 했는가 — 팬 끝의 click 이 선택을 지우면 안 된다.
  canvas.addEventListener("pointerdown", (e) => {
    // ★ 링크를 제외하지 않으면 선 위에서 눌러도 팬이 시작되고, `setPointerCapture` 가
    //   걸린 뒤의 click 은 대상이 캔버스로 바뀐다 — 선택이 통째로 죽는다.
    //   (보이는 것은 멀쩡하고 클릭만 안 먹는 종류라 화면으로는 안 잡힌다.)
    if (e.target.closest("[data-node]") || e.target.closest("[data-link]") || e.target.closest(".zoom")) return;
    drag = { x: e.clientX, y: e.clientY, tx, ty };
    canvas.classList.add("dragging");
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!drag) return;
    tx = drag.tx + (e.clientX - drag.x);
    ty = drag.ty + (e.clientY - drag.y);
    if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 3) panned = true;
    apply();
  });
  canvas.addEventListener("pointerup", () => { drag = null; canvas.classList.remove("dragging"); });
  canvas.addEventListener("pointercancel", () => { drag = null; canvas.classList.remove("dragging"); });

  document.querySelector(".zoom").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.z === "fit") return fit(0);
    const r = canvas.getBoundingClientRect();
    const cx = r.width / 2, cy = r.height / 2;
    const next = Math.min(2.6, Math.max(0.18, scale * (b.dataset.z === "in" ? 1.25 : 1 / 1.25)));
    tx = cx - (cx - tx) * (next / scale);
    ty = cy - (cy - ty) * (next / scale);
    scale = next;
    apply();
  });

  showThesis();
  fit(0.82);
  // 리사이즈에도 같은 규칙 — 좁아졌다고 글자가 안 읽히게 만들지 않는다.
  window.addEventListener("resize", () => fit(0.82));
})();
</script>
