# xcodegen 프로젝트 정의 — `brew install xcodegen` 후 이 폴더에서 `xcodegen generate` 실행 (선택 경로)
name: SafetyWatchPoC
options:
  bundleIdPrefix: kr.indusview
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
targets:
  SafetyWatchPoC:
    type: application
    platform: watchOS
    sources:
      - Sources
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kr.indusview.safetyWatchPoC
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: F2P5ZFP65Q
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SupportingFiles/Info.plist
        CODE_SIGN_ENTITLEMENTS: SupportingFiles/SafetyWatchPoC.entitlements
        RECEIVER_URL_DEFAULT: "https://recognized-marble-moscow-assisted.trycloudflare.com/api/mock/vital"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
