# 관제 웹 포트 3000 을 허용목록 IP 에게만 LAN 개방하고 나머지(조원 포함)는 차단하는 pf 규칙.
#   로딩:  sudo pfctl -e -f scripts/lan-firewall.pf.conf
#   해제:  sudo pfctl -d
#   허용 IP 관리는 scripts/lan-firewall.sh (add/del/list) 가 테이블에 반영.
#
# 동작: 루프백(lo0)은 항상 통과 → cloudflared 터널(localhost:3000)·내 편집은 영향 없음.
#       포트 3000 인바운드 TCP 중 허용목록(safetymonitor_lan_allow)에 없는 출발지는 즉시 차단.
#       그 외 모든 트래픽은 pf 기본 통과(이 룰셋은 포트 3000 만 제한 → blast radius 최소).

set skip on lo0
table <safetymonitor_lan_allow> persist
block in quick proto tcp from ! <safetymonitor_lan_allow> to any port 3000
