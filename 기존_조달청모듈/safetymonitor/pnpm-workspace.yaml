# SafetyMonitor 모노레포 워크스페이스 정의
packages:
  - "packages/*"
  - "apps/dashboard-web"
  - "backend/infrastructure"
  - "backend/lambdas/*"
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
onlyBuiltDependencies:
  - better-sqlite3
  - esbuild
  - sharp
# brace-expansion DoS(GHSA-rgw5-rvv9-x895 — 기존 완화책을 우회하는 새 advisory, 2026-08-03 공개).
# 세 major 대역이 동시에 물려 있는데 전부 **같은 major 안의 패치**로 해소된다(major 점프 없음).
#   1.1.15 → 1.1.18   2.1.1 → 2.1.4   5.0.6 → 5.0.9
# ignoreGhsas 로 덮지 않고 실제로 올린다 — 위 예외 목록의 brace-expansion 2건도 같이 해소된다.
overrides:
  brace-expansion@1: 1.1.18
  brace-expansion@2: 2.1.4
  brace-expansion@5: 5.0.9
# CI `pnpm audit --audit-level=high` 게이트의 명시 예외 — 감사(2026-07-29) 시점의 기존 high 8건.
# 대부분 exceljs 하위 의존(4주차 overrides 정리 대상). 새 취약점 유입만 게이트가 잡는다.
# 항목을 지우려면 해당 GHSA 가 실제 해소(의존 업데이트/overrides)됐는지 pnpm audit 로 확인할 것.
auditConfig:
  ignoreGhsas:
    - GHSA-7c78-jf6q-g5cm # tmp 경로순회 (exceljs 하위)
    # brace-expansion 2건(GHSA-3jxr-9vmj-r5cp·GHSA-mh99-v99m-4gvg)은 위 overrides 로 실제 해소돼 제거했다.
    - GHSA-52cp-r559-cp3m # js-yaml CPU DoS
    - GHSA-vcrf-j523-4mrf # aws-cdk-lib (AWS 트랙 보류·미도달)
    - GHSA-f88m-g3jw-g9cj # sharp/libvips (next/image 미사용·미도달)
    - GHSA-6g55-p6wh-862q # postcss 파일 읽기 (빌드타임)
    - GHSA-r28c-9q8g-f849 # postcss 경로순회 (빌드타임)
