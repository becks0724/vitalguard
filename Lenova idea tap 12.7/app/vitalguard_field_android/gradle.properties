org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# AGP 9의 내장 Kotlin 대신 지시서의 Kotlin Android 2.4.0 플러그인을 사용한다.
android.builtInKotlin=false
# 기존 워치와 동일: 외부 Kotlin 플러그인/스크린샷 alpha15의 기존 Android DSL 사용.
android.newDsl=false
android.experimental.enableScreenshotTest=true
# AGP 9.1.0 이 권장하는 최대 compileSdk 는 36 이지만 Compose 1.12·core 1.19 가 37 을 요구한다.
android.suppressUnsupportedCompileSdk=37
