name: VitAlGuard
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
targets:
  VitAlGuard:
    type: application
    platform: iOS
    sources:
      - Phone/Sources
      - Phone/Shared
      - path: Phone/Assets
        buildPhase: resources
      - path: Phone/IconAssets.xcassets
        buildPhase: resources
      - path: Phone/LaunchScreen.storyboard
        buildPhase: resources
      - path: Phone/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yangjeehoo.vitalguard
        PRODUCT_NAME: VitAlGuard
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Phone/BundleTemplate/VitAlGuard.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: R2684PTQQZ
        MARKETING_VERSION: "8.2"
        CURRENT_PROJECT_VERSION: "82"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Phone/BundleTemplate/Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - target: VitAlGuardPhoneWatchWidgets
        embed: true
      - target: VitAlGuard Watch
        embed: true
  VitAlGuardPhoneWatchWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Phone/Widgets
      - Phone/Shared
      - path: Phone/IconAssets.xcassets
        buildPhase: resources
      - path: Phone/Widgets/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yangjeehoo.vitalguard.widgets
        PRODUCT_NAME: VitAlGuardWidgets
        CODE_SIGN_ENTITLEMENTS: Phone/Widgets/VitAlGuardWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: R2684PTQQZ
        MARKETING_VERSION: "8.2"
        CURRENT_PROJECT_VERSION: "82"
        EXTRACT_APP_INTENTS_METADATA: NO
        APP_SHORTCUTS_ENABLE_FLEXIBLE_MATCHING: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Phone/Widgets/Info.plist
        SWIFT_VERSION: "5.0"
        SKIP_INSTALL: YES
  VitAlGuard Watch:
    type: application
    platform: watchOS
    sources:
      - Watch/Sources
      - path: Watch/ML
        buildPhase: resources
      - path: Watch/Assets.xcassets
        buildPhase: resources
      - path: Watch/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yangjeehoo.vitalguard.watch
        PRODUCT_NAME: VitAlGuardWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: R2684PTQQZ
        MARKETING_VERSION: "8.2"
        CURRENT_PROJECT_VERSION: "82"
        EXTRACT_APP_INTENTS_METADATA: NO
        APP_SHORTCUTS_ENABLE_FLEXIBLE_MATCHING: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Watch/SupportingFiles/Info.plist
        CODE_SIGN_ENTITLEMENTS: Watch/SupportingFiles/VitAlGuardForWatch.entitlements
        RECEIVER_URL_DEFAULT: "https://vitalguard-dashboard-569797426568.asia-northeast3.run.app/api/mock/vital"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        SDKROOT: watchos
        SKIP_INSTALL: YES
