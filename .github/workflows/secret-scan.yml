# push/PR 마다 시크릿(API 키·토큰) 유출을 탐지하는 CI. GitHub 시크릿 스캐닝(비공개 레포 유료)의 무료 대체.
# gitleaks 공식 Action 은 조직 레포에서 라이선스 키를 요구하므로, MIT 라이선스인 CLI 바이너리를 직접 받아 실행한다.
name: Secret scan

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 액션은 SHA 핀 — 태그는 이동 가능해 공급망 변조 표면이 된다(감사 CI-PIN-01). 동작 무변경(당시 v4 SHA).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0        # 전체 히스토리를 봐야 과거 커밋에 섞인 키도 잡힌다

      - name: gitleaks 설치
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: 스캔
        run: gitleaks git --no-banner --redact --exit-code 1 --report-format sarif --report-path gitleaks.sarif .

      - name: 리포트 업로드
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
