# ⚠ 휴면 상태(2026-08-19 확인) — 죽은 코드가 아니라 **안 쓰는 기능**이다. 지우기 전에 읽을 것.
#
#   실행 이력   2026-07-22 ~ 07-26 **5회 전부 success**(v7.3~v7.8 릴리스를 실제로 만들었다)
#   왜 안 도나  8.x 부터 **태그 없이 main 직접 적재**로 바꿨다(`release: VitAlGuard 8.x` 커밋들).
#   릴리스 0개  08-12 히스토리 재작성 때 원격 태그와 함께 사라졌다. 워크플로 탓이 아니다.
#
# ★ 로컬 태그 6개가 **단일 사본**이다(원격 태그 0). 백업하려고 `git push --tags` 를 하면
#   아래 트리거가 **6번 발동해 릴리스 6개를 만든다.** 조용히 백업하려면 이 파일을 먼저 치우거나
#   태그를 하나씩 밀면서 확인할 것. 태그 백업 여부는 아직 사용자 판단 대기다.
name: Publish VitAlGuard source release

on:
  push:
    tags:
      - 'v*-build.*'
      - 'vitalguard-v*-build.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub source release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          normalized_tag="${TAG#vitalguard-v}"
          normalized_tag="${normalized_tag#v}"
          version="${normalized_tag%-build.*}"
          build="${normalized_tag##*-build.}"
          pushed_at="$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S KST')"
          title="VitAlGuard ${version} (Build ${build})"
          notes=$(printf '%s\n' \
            '## VitAlGuard 소스 릴리스' \
            '' \
            "- 버전: ${version}" \
            "- 빌드번호: ${build}" \
            "- 푸시 날짜: ${pushed_at}" \
            '' \
            '이 Release에는 Mac의 Xcode에서 열 수 있는 iPhone 및 Apple Watch 소스가 연결되어 있습니다.' \
            'Apple 인증서, 프로비저닝 프로파일, IPA 및 개인 설정은 포함하지 않습니다.')

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
          fi
