# safetymonitor 모노레포의 typecheck·lint·test 를 push/PR 마다 강제하는 CI (lessons L-17)
name: Verify safetymonitor

# ⚠ 문서만 바뀐 커밋에는 돌지 않는다(2026-08-28) — Free 플랜 Actions 2,000분/월을 8월에
#   **정확히 100% 소진**해 CI 전체가 멈췄다. 최근 100건을 세어 보니 docs/chore 커밋이 유발한
#   실행이 31건(31%)이었고, 이 워크플로만 15건이었다(2분×15 = 30분).
#   ★ `!` 부정 패턴은 **나중 줄이 이긴다** — 제외 규칙을 포함 규칙 뒤에 둘 것.
#   ⚠ 워크플로 파일 자신은 제외 뒤에 다시 넣는다. 안 그러면 CI 설정을 고쳐도 검증이 안 돈다.
on:
  push:
    branches: [main]
    paths:
      - '기존_조달청모듈/safetymonitor/**'
      - '!기존_조달청모듈/safetymonitor/docs/**'
      - '!기존_조달청모듈/safetymonitor/**/*.md'
      - '.github/workflows/verify-safetymonitor.yml'
  pull_request:
    paths:
      - '기존_조달청모듈/safetymonitor/**'
      - '!기존_조달청모듈/safetymonitor/docs/**'
      - '!기존_조달청모듈/safetymonitor/**/*.md'
      - '.github/workflows/verify-safetymonitor.yml'

permissions:
  contents: read

concurrency:
  group: verify-safetymonitor-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: 기존_조달청모듈/safetymonitor

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 액션은 SHA 핀 — 태그는 이동 가능해 공급망 변조 표면이 된다(감사 CI-PIN-01). 동작 무변경(당시 v4 SHA).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: 기존_조달청모듈/safetymonitor/pnpm-lock.yaml

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # 공급망 감시(감사 SEC-SUPPLY-01) — 기존 high 8건(exceljs 계열 등)은 pnpm-workspace.yaml 의
      # auditConfig.ignoreGhsas 에 명시 예외(4주차 overrides 정리 대상)로 두고,
      # 새로 유입되는 high 이상만 여기서 차단한다.
      - name: 의존성 취약점 감사
        run: pnpm audit --audit-level=high

      # packages/*/dist 는 gitignore 라 clean clone 엔 없다. dashboard-web 이
      # @safetymonitor/schemas 타입을 dist 에서 찾으므로 먼저 빌드해야 한다.
      - name: 워크스페이스 패키지 빌드
        run: pnpm -r --filter=./packages/* build

      # 싼 것 → 비싼 것 순서. typecheck 가 next build 와 같은 게이트다(L-10).
      - name: 타입
        run: pnpm typecheck

      - name: 린트
        run: pnpm lint

      # 의존 그래프 회귀 게이트 — 순환 개수가 기준선을 넘거나 경계 규칙을 어기면 실패한다.
      # 판정은 scripts/graph-check.mjs 가 한다(그래프가 바뀌었다는 사실 자체는 신호가 아니다).
      # graphviz 불필요 — JSON 만 읽는다. 실측 1.5초.
      - name: 의존성 그래프
        run: pnpm -C apps/dashboard-web run graph:check

      - name: 단위 테스트
        run: pnpm test
