# 폰·워치 앱(vitalguard_app) CI — 모노레포 CI 가 앱을 검사하지 않는 구멍을 메운다
#
# ★ 왜 필요한가. `verify-safetymonitor.yml` 의 paths 는 `기존_조달청모듈/safetymonitor/**` 라
#   앱을 바꾸면 그 워크플로가 **돌기는 한다**. 그런데 검사 대상은 pnpm 워크스페이스뿐이고
#   (`pnpm-workspace.yaml` = packages/* · apps/dashboard-web · backend/*, 루트 스크립트도
#   `--filter=./packages/* --filter=./apps/dashboard-web` 고정) **`apps/vitalguard_app` 은 그 밖**이다.
#   ⟹ 앱만 바꾼 커밋이 **초록불을 받는데 앱은 한 줄도 검사되지 않는다.**
#   실제 사례 = 커밋 `3a38c20`(WatchStreamer.swift·VitalPipeline.swift 변경)이 success.
#   같은 날 워치 파일의 구문 오류를 잡은 것은 CI 가 아니라 사람의 로컬 빌드였다.
#
# 이 워크플로가 잡는 것 / 못 잡는 것
#   잡음   Dart 정적 분석·위젯 테스트 · **Swift 구문 오류**(`} 전` 류 — 실측으로 확인)
#   못 잡음 Swift **타입** 오류. `-parse` 는 구문만 본다(실측 확인).
#          그건 macOS `xcodebuild` 가 필요한데 러너 과금이 10배라 별도 단계로 미뤘다.

name: Verify app

# ⚠ 문서만 바뀐 커밋에는 돌지 않는다(2026-08-28 · verify-safetymonitor 와 같은 규칙).
#   앱 폴더에도 SETUP.md 같은 문서가 있어 그것만 고쳐도 Flutter 검증이 통째로 돌았다.
#   ★ `!` 부정 패턴은 나중 줄이 이긴다 — 워크플로 파일 자신은 제외 뒤에 다시 넣는다.
on:
  push:
    branches: [main]
    paths:
      - '기존_조달청모듈/safetymonitor/apps/vitalguard_app/**'
      - '!기존_조달청모듈/safetymonitor/apps/vitalguard_app/**/*.md'
      - '.github/workflows/verify-app.yml'
  pull_request:
    paths:
      - '기존_조달청모듈/safetymonitor/apps/vitalguard_app/**'
      - '!기존_조달청모듈/safetymonitor/apps/vitalguard_app/**/*.md'
      - '.github/workflows/verify-app.yml'

permissions:
  contents: read

# ⚠ group 이름이 `verify-safetymonitor-…` 와 **달라야 한다** — 같으면 두 워크플로가
#   `cancel-in-progress` 로 서로를 취소해 한쪽이 조용히 안 돌게 된다.
concurrency:
  group: verify-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 기존_조달청모듈/safetymonitor/apps/vitalguard_app
    steps:
      # 액션은 SHA 핀 — 태그는 이동 가능해 공급망 변조 표면이 된다(감사 CI-PIN-01).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.3 # 로컬 검증 버전과 일치시킨다(pubspec sdk ^3.12.2)
          channel: stable
          cache: true

      - name: 의존성 설치
        run: flutter pub get

      # ⚠ `flutter analyze` 는 **한글 경로에서 JSON 크래시**한다(이 레포 경로에 `기존_조달청모듈` 이 있다).
      #   `dart analyze` 로 대체하는 것이 이 레포의 확립된 우회다.
      - name: Dart 정적 분석
        run: dart analyze

      - name: 위젯 테스트
        run: flutter test

  swift-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # 리눅스 공식 Swift 이미지. `swiftc -parse` 는 모듈을 해석하지 않으므로
    # HealthKit·WatchKit 같은 Apple 전용 import 가 있어도 구문 검사가 성립한다(실측).
    container: swift:6.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Swift 구문 검사
        working-directory: 기존_조달청모듈/safetymonitor/apps/vitalguard_app/ios
        # ⚠ 컨테이너 잡의 기본 셸은 `sh`(dash)라 `pipefail` 이 없다 — 명시하지 않으면
        #   `set -o pipefail` 이 `Illegal option` 으로 죽는다(첫 CI 실행에서 실측).
        #   로컬 zsh/bash 에서는 재현되지 않는 종류다.
        shell: bash
        run: |
          set -euo pipefail
          files=$(find Runner VitalWatch -name '*.swift' | sort)
          echo "$files"
          # ★ 대상이 0개면 **조용히 통과**한다 — 검사가 아니라 장식이 된다.
          #   파일이 옮겨가거나 경로가 바뀌면 여기서 멈춘다.
          count=$(printf '%s\n' "$files" | grep -c . || true)
          echo "검사 대상 ${count}개"
          test "$count" -ge 8
          swiftc -parse $files
